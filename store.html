<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Farm Store — Lancer Farms &amp; Gardens</title>
<meta name="description" content="Lancer Farms & Gardens merchandise — coming soon.">
<link rel="icon" type="image/webp" href="lfg-logo-192.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@300;400;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#2A2620; --card:#34302A; --line:#45423A; --line-strong:#5A554A;
    --ink:#F0EDE2; --soft:#B0A99C; --leaf:#A8B89A; --green:#7E9A6E;
    --amber:#C9973F;
    --font-mono:'Courier Prime',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:'Source Sans 3',system-ui,sans-serif; font-size:17px; line-height:1.6;
    color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
  }
  h1,h2{font-family:'Fraunces',Georgia,serif; font-weight:600; line-height:1.15;}
  .wrap{max-width:520px; margin:0 auto; padding:0 22px; text-align:center;}
  a{color:inherit;}

  .top{padding:60px 0 30px;}
  .kick{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--leaf); margin-bottom:14px;}
  .mark{width:76px; height:76px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
    font-size:32px; border:1.5px solid var(--line-strong); border-radius:50%;}
  h1{font-size:clamp(26px,7vw,36px); margin-bottom:10px;}
  .top p{color:var(--soft); font-size:15.5px; max-width:420px; margin:0 auto;}

  .badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:4px 12px; border-radius:999px; background:rgba(201,151,63,.2); color:var(--amber); margin:20px 0;}

  .itemgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0; text-align:left;}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 10px;
    text-align:center; opacity:.7;}
  .item .ic{font-size:26px; margin-bottom:8px;}
  .item span{display:block; font-size:12px; color:var(--soft);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px;
    padding:0 24px; border-radius:12px; font-weight:600; font-size:15px; text-decoration:none;
    border:1.5px solid var(--line-strong); color:var(--ink); background:var(--card); margin-top:10px;}
  .btn.lead{background:var(--green); border-color:var(--green); color:#fff;}

  footer{padding:30px 22px 10px; text-align:center; font-size:11.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--line-strong);}
</style>
<link rel="stylesheet" href="grush-tokens.css?v=1">
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="kick">Farm Store</div>
    <h1>Coming soon</h1>
    <p>Farm-grown and farm-branded goods, with proceeds going straight back into Lancer Farms &amp; Gardens.</p>
    <div class="badge">In planning</div>
  </div>

  <div class="itemgrid">
    <div class="item"><div class="ic">&#128085;</div><span>Shirts</span></div>
    <div class="item"><div class="ic">&#9749;</div><span>Mugs</span></div>
    <div class="item"><div class="ic">&#127991;&#65039;</div><span>Stickers</span></div>
    <div class="item"><div class="ic">&#127807;</div><span>Succulents &amp; plants</span></div>
    <div class="item"><div class="ic">&#127928;</div><span>Handmade pots</span></div>
    <div class="item"><div class="ic">&#10024;</div><span>More to come</span></div>
  </div>

  <a class="btn lead" href="fund-the-farm.html">Support the farm now instead &#8594;</a>
</div>

<footer>Lancer Farms &amp; Gardens · CBU Environmental Science</footer>

<script>
window.GRUSH_NAV = { eyebrow: 'Support this site', rail: false, title: 'Lancer Farms & Gardens' };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lfg-config.js"></script>
<script src="grush-auth.js?v=2"></script>
<script src="grush-menu.js?v=1"></script>
<script src="grush-desk-staff.js?v=10"></script>
<script src="grush-nav.js?v=5"></script>
<script src="i18n.js?v=2"></script>

</body>
</html>
