<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>See — Lancer Farms &amp; Gardens</title>
<meta name="description" content="Photographs from the beds and grounds of Lancer Farms &amp; Gardens.">
<link rel="icon" type="image/webp" href="lfg-logo-192.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lfg-config.js"></script>
<script src="grush-auth.js?v=2"></script>
<style>
  :root{
    --ink:#F0EDE2; --ink-soft:#B0A99C; --paper:#2A2620; --card:#34302A;
    --line:#45423A; --line-strong:#5A554A;
    --green:#7E9A6E; --leaf:#A8B89A; --amber:#C9973F;
    --shadow:0 1px 0 rgba(32,38,28,.04), 0 2px 8px rgba(32,38,28,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{font-family:'Source Sans 3',system-ui,sans-serif; color:var(--ink);
    background:var(--paper); -webkit-font-smoothing:antialiased;}
  h1{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0; font-size:28px;}

  .wrap{max-width:560px; margin:0 auto; padding:32px 18px 48px;}
  .back{display:inline-block; font-size:13px; color:var(--leaf); text-decoration:none; margin:0 6px 20px;}
  .back:hover{color:var(--ink);}
  .head{padding:0 6px;}
  .lede{color:var(--ink-soft); font-size:14px; line-height:1.5; margin:4px 0 20px;}

  /* Filter chips read as controls, not labels: border, fill, tap height. */
  .filters{display:flex; gap:8px; overflow-x:auto; padding:0 6px 4px; margin-bottom:18px;
    scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; min-height:38px; border:1.5px solid var(--line-strong); background:var(--card);
    color:var(--ink-soft); border-radius:999px; padding:0 16px; font-family:inherit;
    font-size:14px; font-weight:600; white-space:nowrap;}
  .chip.on{background:var(--green); color:#fff; border-color:var(--green);}
  .chip:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (min-width:520px){ .grid{grid-template-columns:repeat(3,1fr);} }

  .cell{position:relative; padding:0; border:1.5px solid var(--line); border-radius:14px;
    overflow:hidden; background:var(--card); aspect-ratio:1/1; cursor:pointer;
    transition:transform .1s, border-color .2s;}
  .cell:active{transform:scale(.985);}
  .cell:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}
  .cell img{width:100%; height:100%; object-fit:cover; display:block;}
  .cell .cap{position:absolute; left:0; right:0; bottom:0; padding:18px 10px 8px;
    background:linear-gradient(to top, rgba(26,23,19,.92), rgba(26,23,19,0));
    font-size:12.5px; font-weight:600; text-align:left; color:var(--ink);
    text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .cell .bed{position:absolute; top:8px; right:8px; font-size:10px; font-weight:700;
    letter-spacing:.1em; background:rgba(26,23,19,.78); color:var(--leaf);
    border:1px solid rgba(168,184,154,.4); border-radius:999px; padding:3px 8px;}

  .state{padding:36px 6px; text-align:center; color:var(--ink-soft); font-size:14.5px; line-height:1.55;}

  /* Lightbox */
  #lb{position:fixed; inset:0; background:rgba(20,18,15,.96); z-index:300; display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:20px;}
  #lb.on{display:flex;}
  #lb img{max-width:100%; max-height:70vh; border-radius:14px; display:block;}
  #lb .meta{max-width:520px; text-align:center; margin-top:16px;}
  #lb .cap2{font-size:17px; font-weight:600; line-height:1.4;}
  #lb .sub2{font-size:13px; color:var(--ink-soft); margin-top:6px; letter-spacing:.04em;}
  #lb .tag{display:inline-block; margin-top:12px; font-size:12px; font-weight:600;
    color:var(--leaf); border:1px solid var(--line-strong); border-radius:999px; padding:5px 12px;}
  #lb .x{position:absolute; top:14px; right:14px; width:46px; height:46px; border-radius:999px;
    border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink);
    font-size:22px; line-height:1; font-family:inherit;}
  #lb .nav{position:absolute; top:50%; transform:translateY(-50%); width:48px; height:64px;
    border:1.5px solid var(--line-strong); background:rgba(52,48,42,.85); color:var(--ink);
    border-radius:14px; font-size:22px; font-family:inherit;}
  #lb .prev{left:10px;} #lb .next{right:10px;}
  #lb button:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}

  footer{margin-top:36px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--line-strong); text-align:center;}
  footer a{color:var(--line-strong); text-decoration:none;}

  @media (prefers-reduced-motion: reduce){ .cell{transition:none;} .cell:active{transform:none;} }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="visitor.html">&larr; Back to the farm</a>
  <div class="head">
    <h1>See</h1>
    <p class="lede">Photographs from the beds and grounds, taken by the caretaker crew.</p>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="state" id="state">Loading photographs&hellip;</div>

  <footer><a href="https://getgrush.com">managed by grush</a></footer>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="x" id="lb-x" aria-label="Close">&times;</button>
  <button class="nav prev" id="lb-prev" aria-label="Previous">&#8249;</button>
  <button class="nav next" id="lb-next" aria-label="Next">&#8250;</button>
  <img id="lb-img" alt="">
  <div class="meta">
    <div class="cap2" id="lb-cap"></div>
    <div class="sub2" id="lb-sub"></div>
    <div id="lb-tagwrap"></div>
  </div>
</div>

<script>
const sb = GRUSH.sb;
let PHOTOS = [], VIEW = [], cur = -1;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

async function load(){
  const state = document.getElementById('state');
  try{
    const { data, error } = await sb.from('lfg_photos')
      .select('id,caption,cloudinary_url,thumbnail_url,uploaded_at,subject_type,'
            + 'lfg_growing_areas(code,name,zone)')
      .eq('approval_status','approved')
      .order('uploaded_at', { ascending:false });
    if(error) throw error;

    PHOTOS = (data || []).filter(p => p.cloudinary_url || p.thumbnail_url);
    if(!PHOTOS.length){
      state.textContent = 'No photographs have been approved yet. Check back after the next work day.';
      return;
    }
    state.style.display = 'none';
    buildFilters();
    apply('all');
  }catch(e){
    /* Say what failed and what to do — never a bare spinner that never ends. */
    state.textContent = 'The photographs could not be loaded. Check your connection and reload.';
  }
}

function zoneOf(p){
  const a = p.lfg_growing_areas;
  return (a && a.zone) ? a.zone : null;
}

function buildFilters(){
  const zones = [];
  PHOTOS.forEach(function(p){
    const z = zoneOf(p);
    if(z && zones.indexOf(z) === -1) zones.push(z);
  });
  zones.sort();

  const box = document.getElementById('filters');
  const defs = [{ k:'all', label:'All ' + PHOTOS.length }].concat(
    zones.map(z => ({ k:z, label:z }))
  );
  box.innerHTML = '';
  defs.forEach(function(d, i){
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' on' : '');
    b.textContent = d.label;
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', function(){
      box.querySelectorAll('.chip').forEach(function(c){
        c.classList.remove('on'); c.setAttribute('aria-pressed','false');
      });
      b.classList.add('on'); b.setAttribute('aria-pressed','true');
      apply(d.k);
    });
    box.appendChild(b);
  });
}

function apply(key){
  VIEW = (key === 'all') ? PHOTOS.slice() : PHOTOS.filter(p => zoneOf(p) === key);
  const grid = document.getElementById('grid');
  grid.innerHTML = VIEW.map(function(p, i){
    const a = p.lfg_growing_areas;
    const bed = (a && a.code) ? '<span class="bed">' + esc(a.code) + '</span>' : '';
    const cap = p.caption ? '<span class="cap">' + esc(p.caption) + '</span>' : '';
    const src = p.thumbnail_url || p.cloudinary_url;
    return '<button class="cell" data-i="' + i + '" aria-label="'
      + esc(p.caption || 'Photograph') + '">'
      + '<img src="' + esc(src) + '" alt="' + esc(p.caption || '') + '" loading="lazy">'
      + bed + cap + '</button>';
  }).join('');
  grid.querySelectorAll('.cell').forEach(function(el){
    el.addEventListener('click', function(){ open(Number(el.dataset.i)); });
  });
}

/* ── lightbox ───────────────────────────────────────────────────────────
   Plant tags are shown but do not link yet: Learn is not built. A chip that
   goes nowhere is honest; a link that 404s is not. */
function open(i){
  if(i < 0 || i >= VIEW.length) return;
  cur = i;
  const p = VIEW[i], a = p.lfg_growing_areas;
  document.getElementById('lb-img').src = p.cloudinary_url || p.thumbnail_url;
  document.getElementById('lb-img').alt = p.caption || 'Photograph from the farm';
  document.getElementById('lb-cap').textContent = p.caption || 'Untitled';

  const bits = [];
  if(a && a.code) bits.push('Bed ' + a.code);
  else if(a && a.name) bits.push(a.name);
  if(p.uploaded_at) bits.push(new Date(p.uploaded_at)
    .toLocaleDateString(undefined, { month:'long', year:'numeric' }));
  document.getElementById('lb-sub').textContent = bits.join(' · ');

  document.getElementById('lb-tagwrap').innerHTML = p.subject_type
    ? '<span class="tag">' + esc(p.subject_type) + '</span>' : '';

  document.getElementById('lb').classList.add('on');
  document.getElementById('lb-x').focus();
}
function close(){ document.getElementById('lb').classList.remove('on'); }
function step(d){ const n = cur + d; if(n >= 0 && n < VIEW.length) open(n); }

document.getElementById('lb-x').addEventListener('click', close);
document.getElementById('lb-prev').addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
document.getElementById('lb-next').addEventListener('click', function(e){ e.stopPropagation(); step(1); });
document.getElementById('lb').addEventListener('click', function(e){ if(e.target.id === 'lb') close(); });
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lb').classList.contains('on')) return;
  if(e.key === 'Escape') close();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});

load();
</script>

<script>
  window.GRUSH_NAV = { rail: false, title: 'Lancer Farms' };
</script>
<script src="grush-nav.js"></script>

</body>
</html>
