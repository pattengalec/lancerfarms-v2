<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Learn — Lancer Farms &amp; Gardens</title>
<meta name="description" content="What grows at Lancer Farms &amp; Gardens, and what it needs.">
<link rel="icon" type="image/webp" href="lfg-logo-192.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lfg-config.js"></script>
<script src="lfg-db.js?v=1"></script>
<style>
  :root{
    --ink:#F0EDE2; --ink-soft:#B0A99C; --paper:#2A2620; --card:#34302A;
    --line:#45423A; --line-strong:#5A554A;
    --green:#7E9A6E; --leaf:#A8B89A; --amber:#C9973F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{font-family:'Source Sans 3',system-ui,sans-serif; color:var(--ink);
    background:var(--paper); -webkit-font-smoothing:antialiased;}
  h1{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0; font-size:28px;}

  .wrap{max-width:560px; margin:0 auto; padding:32px 18px 48px;}
  .back{display:inline-block; font-size:13px; color:var(--leaf); text-decoration:none; margin:0 6px 20px;}
  .back:hover{color:var(--ink);}
  .head{padding:0 6px;}
  .lede{color:var(--ink-soft); font-size:14px; line-height:1.5; margin:4px 0 20px;}

  /* Search is a control, so it looks like one: full height, real border. */
  .search{width:calc(100% - 12px); margin:0 6px 14px; min-height:46px; background:var(--card);
    border:1.5px solid var(--line-strong); border-radius:12px; padding:0 14px;
    font-family:inherit; font-size:16px; color:var(--ink);}
  .search::placeholder{color:var(--ink-soft);}
  .search:focus-visible{outline:3px solid var(--leaf); outline-offset:2px;}

  .filters{display:flex; gap:8px; overflow-x:auto; padding:0 6px 4px; margin-bottom:18px;
    scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; min-height:38px; border:1.5px solid var(--line-strong); background:var(--card);
    color:var(--ink-soft); border-radius:999px; padding:0 16px; font-family:inherit;
    font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .chip.on{background:var(--green); color:#fff; border-color:var(--green);}
  .chip:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}

  .list{display:flex; flex-direction:column; gap:10px;}

  /* No plant photographs exist yet, so the card leads with the initial rather
     than a grey rectangle pretending an image is coming. */
  .row{display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card); border:1.5px solid var(--line); border-radius:14px;
    padding:12px 14px; min-height:74px; font-family:inherit; color:var(--ink);
    cursor:pointer; transition:transform .1s, border-color .2s;}
  .row:active{transform:scale(.99);}
  .row:hover{border-color:var(--line-strong);}
  .row:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}
  .mono{flex:0 0 auto; width:46px; height:46px; border-radius:11px; display:grid;
    place-items:center; background:rgba(126,154,110,.16); border:1.5px solid rgba(126,154,110,.4);
    font-family:'Fraunces',Georgia,serif; font-size:20px; font-weight:600; color:var(--leaf);}
  .row .nm{font-size:16px; font-weight:600; line-height:1.25;}
  .row .bo{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:2px;}
  .row .go{margin-left:auto; color:var(--ink-soft); font-size:18px;}

  .state{color:var(--ink-soft); font-size:14px; padding:24px 6px; line-height:1.5;}

  /* ── detail sheet ── */
  .sheet{position:fixed; inset:0; background:rgba(20,18,15,.94); display:none;
    overflow-y:auto; z-index:60;}
  .sheet.on{display:block;}
  .sheet-in{max-width:560px; margin:0 auto; padding:20px 18px 56px;}
  .x{position:sticky; top:0; float:right; width:44px; height:44px; border-radius:999px;
    background:var(--card); border:1.5px solid var(--line-strong); color:var(--ink);
    font-size:20px; cursor:pointer;}
  .x:focus-visible{outline:3px solid var(--leaf); outline-offset:3px;}
  .d-name{font-family:'Fraunces',Georgia,serif; font-size:26px; font-weight:600;
    margin:8px 0 2px; line-height:1.2;}
  .d-bot{font-style:italic; color:var(--leaf); font-size:15px; margin-bottom:16px;}
  .d-sum{font-size:16px; line-height:1.62; color:var(--ink); margin:0 0 22px;}
  .facts{display:flex; flex-direction:column; gap:1px; background:var(--line);
    border:1.5px solid var(--line); border-radius:12px; overflow:hidden;}
  .fact{display:flex; justify-content:space-between; gap:16px; background:var(--card);
    padding:12px 14px; font-size:14px;}
  .fact dt{color:var(--ink-soft);}
  .fact dd{margin:0; font-weight:600; text-align:right;}
  .note{font-size:13px; color:var(--ink-soft); line-height:1.55; margin:16px 0 0;}
  .note a{color:var(--leaf);}
  footer{margin-top:36px; text-align:center; font-size:12px; color:var(--ink-soft);}
  footer a{color:var(--ink-soft);}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="visitor.html" data-i18n="back">&larr; Back</a>
  <div class="head">
    <h1 data-i18n="learn.title">Learn</h1>
    <p class="lede" data-i18n="learn.intro">Every plant growing at the farm, what it is, and how long it takes.</p>
  </div>

  <input class="search" id="q" type="search" placeholder="Search plants" autocomplete="off">
  <div class="filters" id="filters"></div>
  <div class="state" id="state">Loading&hellip;</div>
  <div class="list" id="list"></div>

  <footer><a href="https://getgrush.com" translate="no">managed by grush</a></footer>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-in">
    <button class="x" id="sheet-x" aria-label="Close">&times;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
const sb = LFG.sb;
let PLANTS = [], VIEW = [], CAT = 'all';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function filled(v){ return v != null && String(v).trim() !== ''; }

async function load(){
  const state = document.getElementById('state');
  try{
    const { data, error } = await sb.from('lfg_master_plants')
      .select('id,common_name,botanical_name,summary,category,days_to_maturity,stock_image_url')
      .eq('approval_status','approved');
    if(error) throw error;

    /* Eight rows in the table carry a category and nothing else — no name, no
       botanical name, no summary. They are placeholders, not plants, and a
       nameless card would be a lie about what grows here. Drop them. */
    PLANTS = (data || []).filter(p => filled(p.common_name) && filled(p.summary));
    PLANTS.sort((a,b) => a.common_name.localeCompare(b.common_name));

    if(!PLANTS.length){
      state.textContent = 'No plants have been published yet. Check back soon.';
      return;
    }
    state.style.display = 'none';
    buildFilters();
    apply();
  }catch(e){
    state.textContent = 'The plant list could not be loaded. Check your connection and reload.';
  }
}

function buildFilters(){
  const cats = [];
  PLANTS.forEach(function(p){
    const c = filled(p.category) ? p.category : null;
    if(c && cats.indexOf(c) === -1) cats.push(c);
  });
  cats.sort();

  const box = document.getElementById('filters');
  box.innerHTML = '';
  [{k:'all', l:'All ' + PLANTS.length}].concat(cats.map(function(c){
    return { k:c, l:c + ' ' + PLANTS.filter(p => p.category === c).length };
  })).forEach(function(f){
    const b = document.createElement('button');
    b.className = 'chip' + (f.k === CAT ? ' on' : '');
    b.textContent = f.l;
    b.addEventListener('click', function(){
      CAT = f.k;
      box.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      apply();
    });
    box.appendChild(b);
  });
}

function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  VIEW = PLANTS.filter(function(p){
    if(CAT !== 'all' && p.category !== CAT) return false;
    if(!q) return true;
    return (p.common_name + ' ' + (p.botanical_name || '')).toLowerCase().indexOf(q) !== -1;
  });

  const list = document.getElementById('list');
  if(!VIEW.length){
    list.innerHTML = '<div class="state">Nothing matches that. Try a shorter word.</div>';
    return;
  }
  list.innerHTML = VIEW.map(function(p, i){
    /* translate="no" and lang="la": binomial names are Latin and must not
       be machine-translated. Chrome will happily render Mentha spicata as
       "spiked mint" in Spanish, which is not the plant's name and is not
       searchable against any reference. */
    const bot = filled(p.botanical_name)
      ? '<div class="bo" translate="no" lang="la">' + esc(p.botanical_name) + '</div>' : '';
    return '<button class="row" data-i="' + i + '">'
      + '<span class="mono" aria-hidden="true">' + esc(p.common_name.charAt(0)) + '</span>'
      + '<span><span class="nm">' + esc(p.common_name) + '</span>' + bot + '</span>'
      + '<span class="go" aria-hidden="true">&rsaquo;</span></button>';
  }).join('');
  list.querySelectorAll('.row').forEach(function(el){
    el.addEventListener('click', function(){ open(Number(el.dataset.i)); });
  });
}

/* ── detail ─────────────────────────────────────────────────────────────
   Days to maturity is shown only where it exists. For the trees, shrubs and
   perennials it is absent because the measure does not apply to them, not
   because the record is unfinished — so the sheet says which of the two. */
const PERENNIAL = ['Fruit tree','Berry','Shrub'];

function open(i){
  const p = VIEW[i];
  if(!p) return;

  const facts = [];
  if(filled(p.category)) facts.push(['Type', esc(p.category)]);
  if(p.days_to_maturity != null){
    facts.push(['Days to maturity', esc(p.days_to_maturity) + ' days']);
  }

  let dtmNote = '';
  if(p.days_to_maturity != null){
    dtmNote = 'Days to maturity is an estimate kept by the farm. Starting from seed '
            + 'rather than a transplant, or a cold spring, will push it later.';
  } else if(PERENNIAL.indexOf(p.category) !== -1 || /tree|Rose|Rosemary/i.test(p.category || '')){
    dtmNote = 'Days to maturity is not listed because it does not apply to a plant '
            + 'that lives from year to year. This one is measured in seasons.';
  }

  document.getElementById('sheet-body').innerHTML =
      '<div class="d-name">' + esc(p.common_name) + '</div>'
    + (filled(p.botanical_name) ? '<div class="d-bot" translate="no" lang="la">' + esc(p.botanical_name) + '</div>' : '')
    + '<p class="d-sum">' + esc(p.summary) + '</p>'
    + (facts.length
        ? '<dl class="facts">' + facts.map(f =>
            '<div class="fact"><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>').join('')
          + '</dl>'
        : '')
    + (dtmNote ? '<p class="note">' + dtmNote + '</p>' : '')
    + (p.days_to_maturity != null
        ? '<p class="note"><a href="do.html">Work out a harvest date &rarr;</a></p>' : '');

  const sh = document.getElementById('sheet');
  sh.classList.add('on');
  sh.setAttribute('aria-hidden','false');
  document.getElementById('sheet-x').focus();
}

function close(){
  const sh = document.getElementById('sheet');
  sh.classList.remove('on');
  sh.setAttribute('aria-hidden','true');
}

document.getElementById('sheet-x').addEventListener('click', close);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.getElementById('sheet').classList.contains('on')) close();
});
document.getElementById('q').addEventListener('input', apply);

load();
</script>

<script>
  window.GRUSH_NAV = { rail: false, title: 'Lancer Farms' };
</script>
<script src="grush-nav.js"></script>

<!-- Spanish chrome + the language switch. Every other language is
     the browser's job; see i18n.js. -->
<script src="i18n.js?v=2"></script>
</body>
</html>
