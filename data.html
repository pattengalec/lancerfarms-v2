<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFG Data — Lancer Farms & Gardens</title>
<meta name="theme-color" content="#2A3A2E">
<link rel="icon" type="image/webp" href="lfg-logo-192.webp">

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Sans+3:wght@300;400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<!-- The 'lfg-mode' pre-paint bootstrap that used to sit here is gone with
     this page's local ☀ toggle. grush-settings.js owns theming site-wide and
     runs its own applyTheme() from <head> before first paint. -->
<!-- Shared design tokens. This page's own :root below now carries only
     what it genuinely differs on; everything else comes from here. -->
<link rel="stylesheet" href="lfg-theme.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lfg-config.js"></script>
<script src="grush-auth.js?v=2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* The 13 colour tokens that used to sit here are gone — they were
     byte-identical to lfg-theme.css, which is linked above. One palette for
     grush-settings.js to snapshot instead of two copies drifting apart.

     What remains is what this page genuinely differs on: its own serif
     (IM Fell English, not the theme's Georgia), a lighter shadow, the
     green accents used by the bed cards, and the title-bar plates. */
  --forest:     #A8B89A;
  --lime:       #7E9A6E;
  --lime-pale:  #A8B89A;
  /* fixed plates — carry their own background AND ink, so the title bar
     reads the same whichever way the page ground goes. */
  --bar-bg:     #1F1C17;
  --bar-ink:    #F0EDE2;
  --bar-accent: #D4A44E;
  --bar-soft:   #B6C4A9;
  --bar-line:   #45423A;
  --shadow:     0 2px 16px rgba(61,74,62,0.08);
  --font-head:  'IM Fell English', Georgia, serif;
  --font-body:  'Source Sans 3', sans-serif;
  --font-mono:  'Courier Prime', monospace;
}

[data-mode="dark"] {
  --bg:         #24231E;
  --surface:    #262626;
  --card:       #383838;
  --card-border:#45423A;
  --ink:        #F0EDE6;
  --ink-soft:   #A8A39A;
  --accent:     #7E9A6E;
  --mist:       #33312A;
}

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
}

/* ── Site title bar (herbarium plate) ──
   Replaces the green .data-header. A PLATE: its own background and ink,
   identical in both modes, matching visitor/almanac/app. Nowrap + clamp
   so a long name shrinks rather than wrapping and thickening the bar. */
.sitebar{flex:0 0 auto; background:var(--bar-bg); display:flex; align-items:center; gap:10px;
  padding:9px 12px; position:sticky; top:0; z-index:40; flex-wrap:nowrap;
  border-bottom:1px solid var(--bar-line); box-shadow:inset 0 -4px 0 -3px var(--bar-accent);}
.sitebar img{width:36px; height:36px; flex:none; object-fit:contain; border-radius:50%;
  border:1px solid var(--bar-line); padding:2px;}
.sitebar .wrap{flex:1 1 auto; min-width:0; overflow:hidden;}
.sitebar .eb{font-family:var(--font-mono); font-size:.58rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--bar-accent); margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sitebar .wm{font-family:var(--font-head); font-weight:700; line-height:1.05; color:var(--bar-ink);
  font-size:clamp(.95rem, 4.4vw, 1.2rem);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sitebar .wm em{font-style:normal; font-weight:400; color:var(--bar-soft);}

/* per-tab heading, where the tab bar used to be */
.screen-head{flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
  gap:10px; padding:14px 24px 0; max-width:900px; margin:0 auto;}
.screen-head h1{font-family:var(--font-head); font-size:1.35rem; color:var(--ink); margin:0;}
.screen-head .last-updated{font-family:var(--font-mono); font-size:0.66rem; color:var(--ink-soft);
  white-space:nowrap;}

.hdr-btn{background:transparent; border:var(--border-w) solid var(--card-border); color:var(--ink-soft);
  border-radius:20px; padding:5px 11px; font-size:0.7rem; font-family:var(--font-mono);
  text-decoration:none; cursor:pointer; min-height:34px; display:inline-flex; align-items:center;}


/* ── Shell ── */
.data-shell {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

/* ── Tab panels ── */
.tab-panel { display: none; flex-direction: column; gap: 20px; }
.tab-panel.active { display: flex; }

/* ── Stat grid ── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
